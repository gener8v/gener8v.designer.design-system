name: release

# Manual only. A tag push publishing automatically means a mistyped tag ships a
# version, and npm versions cannot be reused.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0"
        required: true
      dry_run:
        description: "Verify and pack without publishing"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Writes the .npmrc that reads NODE_AUTH_TOKEN below. The token is
          # never written to a file in the repository.
          registry-url: https://registry.npmjs.org
          scope: '@gener8v'

      - run: pnpm install --frozen-lockfile

      # `git commit` and `git tag -a` both need an author, and a runner has
      # none. Without this, release.mjs publishes all four packages and then
      # dies on the version commit — which is exactly what 0.2.0 did, leaving
      # npm at 0.2.0 and this repository at 0.1.0.
      - name: Identify the release committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: node scripts/release.mjs "${{ inputs.version }}" ${{ inputs.dry_run && '--dry' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push the version commit and tag
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD:main --follow-tags
