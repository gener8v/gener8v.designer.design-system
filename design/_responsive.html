<!doctype html><html><head><meta charset="utf-8">
<title>Responsive check</title>
<style>body{font:13px ui-monospace,monospace;margin:16px}iframe{width:390px;height:700px;border:1px solid #ccc}</style>
</head><body><div id="out">measuring…</div><div id="frames"></div>
<script>
const PAGES = ["index.html","get-started.html","guidance/screens.html","guidance/overlays.html","guidance/status-and-feedback.html","guidance/navigation.html","guidance/data.html","guidance/input.html","guidance/reading.html","guidance/agents-and-live-work.html","components/agent.html","components/buttons.html","components/cards.html","components/charts.html","components/command.html","components/coverage.html","components/data.html","components/disclosure.html","components/feedback.html","components/flow.html","components/forms.html","components/graph.html","components/inputs.html","components/integrations.html","components/library.html","components/live.html","components/navigation.html","components/reading.html","components/states.html","components/table.html","foundations/color.html","foundations/icons.html","foundations/image.html","foundations/language.html","foundations/layout.html","foundations/type.html","templates/intake/index.html","templates/purchase/index.html","templates/work-item-create/index.html","templates/work-item-close/index.html","templates/app-shell/index.html","templates/landing/index.html","templates/deck/index.html"];
window.RESULTS = [];
(async () => {
  for (const p of PAGES) {
    const f = document.createElement('iframe');
    f.src = '/' + p; document.getElementById('frames').appendChild(f);
    await new Promise(r => { f.onload = r; });
    const d = f.contentDocument.documentElement;
    const offenders = [...f.contentDocument.querySelectorAll('body *')]
      .filter(e => { const r = e.getBoundingClientRect();
        return r.width > 0 && r.right > d.clientWidth + 1
          && getComputedStyle(e.parentElement || e).overflowX !== 'auto'; })
      .slice(0, 4).map(e => e.tagName.toLowerCase() + '.' + (e.className||'').toString().split(' ')[0]
        + '@' + e.getBoundingClientRect().right.toFixed(0));
    window.RESULTS.push({ page: p, vw: d.clientWidth, scrollW: d.scrollWidth,
      overflow: d.scrollWidth > d.clientWidth + 1, offenders });
    f.remove();
  }
  document.getElementById('out').textContent = 'done — ' + window.RESULTS.filter(r=>r.overflow).length + ' failing';
})();
</script></body></html>
